{% if messages %}
<div class="messages-container mb-3">
    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'debug' %}secondary{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show d-flex align-items-center justify-content-between" role="alert">
        <div class="d-flex align-items-center gap-2">
            {% if message.tags == 'success' %}
                <i class="bi bi-check-circle-fill text-success fs-5"></i>
            {% elif message.tags == 'error' %}
                <i class="bi bi-exclamation-octagon-fill text-danger fs-5"></i>
            {% elif message.tags == 'warning' %}
                <i class="bi bi-exclamation-triangle-fill text-warning fs-5"></i>
            {% else %}
                <i class="bi bi-info-circle-fill text-info fs-5"></i>
            {% endif %}
            <span>{{ message }}</span>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
</div>
{% endif %}
