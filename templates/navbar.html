{% load static %}
<header class="app-header">
    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-secondary d-lg-none btn-sm" id="sidebarToggle" type="button" aria-label="Toggle Navigation">
            <i class="bi bi-list fs-5"></i>
        </button>
        <div class="d-none d-sm-block">
            <span class="badge bg-light text-secondary border px-2 py-1 small">
                <i class="bi bi-shield-lock-fill text-primary me-1"></i> Passive Security Mode
            </span>
        </div>
    </div>

    <div class="d-flex align-items-center gap-3">
        <!-- Quick Scan Trigger -->
        <a href="{% url 'scans:new_scan' %}" class="btn btn-primary-cl btn-sm d-flex align-items-center gap-2">
            <i class="bi bi-plus-lg"></i>
            <span class="d-none d-md-inline">Start Scan</span>
        </a>

        {% if user.is_authenticated %}
        <!-- User Dropdown -->
        <div class="dropdown">
            <button class="btn btn-light border-0 d-flex align-items-center gap-2 p-1 pe-2 rounded-pill" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="rounded-circle bg-navy text-white fw-bold d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; font-size: 0.8rem;">
                    {{ user.profile.get_initials }}
                </div>
                <span class="d-none d-md-inline small fw-semibold text-secondary">{{ user.username }}</span>
                <i class="bi bi-chevron-down text-muted small"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 py-2">
                <li class="px-3 py-2 border-bottom">
                    <div class="fw-bold small">{{ user.get_full_name|default:user.username }}</div>
                    <div class="text-muted small">{{ user.email }}</div>
                </li>
                <li><a class="dropdown-item py-2" href="{% url 'accounts:profile' %}"><i class="bi bi-person me-2"></i> Profile</a></li>
                <li><a class="dropdown-item py-2" href="{% url 'accounts:settings' %}"><i class="bi bi-gear me-2"></i> Settings & API</a></li>
                <li><a class="dropdown-item py-2" href="{% url 'accounts:change_password' %}"><i class="bi bi-key me-2"></i> Change Password</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="dropdown-item py-2 text-danger"><i class="bi bi-box-arrow-right me-2"></i> Sign Out</button>
                    </form>
                </li>
            </ul>
        </div>
        {% else %}
        <div class="d-flex gap-2">
            <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary btn-sm">Log In</a>
            <a href="{% url 'accounts:register' %}" class="btn btn-primary-cl btn-sm">Register</a>
        </div>
        {% endif %}
    </div>
</header>
